services:
  pg-master:
    build: .
    image: localhost/postgres:patroni-slave-master
    container_name: pg-master
    hostname: pg-master
    restart: unless-stopped
    expose:
      - '8008'
    ports:
      - '5433:5432'
    volumes:
      - pg-master:/var/lib/postgresql/data
    command: ['patroni', '/postgres0.yml']
    depends_on:
      - zoo
  pg-slave:
    build: .
    image: localhost/postgres:patroni
    container_name: pg-slave
    hostname: pg-slave
    restart: unless-stopped
    expose:
      - '8008'
    ports:
      - '5434:5432'
    volumes:
      - pg-slave:/var/lib/postgresql/data
    command: ['patroni', '/postgres1.yml']
    depends_on:
      - zoo
  zoo:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zoo
    hostname: zoo
    restart: unless-stopped
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  haproxy:
    image: haproxy:3.0
    container_name: postgres_entrypoint
    hostname: haproxy
    restart: unless-stopped
    ports:
      - '5432:5432'
      - '7000:7000'
    depends_on:
      - pg-master
      - pg-slave
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
volumes:
  pg-master:
  pg-slave:
